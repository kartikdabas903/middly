# Middly — DEMO interoperability platform. All secrets come from .env (see .env.example).
name: ${COMPOSE_PROJECT_NAME:-middly}

x-mock: &mock
  build:
    context: ./connectors
    dockerfile: Dockerfile.mock
  restart: unless-stopped
  networks: [middly]
  environment: &mock-env
    MOCK_ADMIN_KEY: ${MOCK_ADMIN_KEY:?set in .env}
    IDENTITY_CLIENT_ID: ${IDENTITY_CLIENT_ID:?}
    IDENTITY_CLIENT_SECRET: ${IDENTITY_CLIENT_SECRET:?}
    EDUCATION_API_KEY: ${EDUCATION_API_KEY:?}
    EMPLOYMENT_BASIC_USER: ${EMPLOYMENT_BASIC_USER:?}
    EMPLOYMENT_BASIC_PASSWORD: ${EMPLOYMENT_BASIC_PASSWORD:?}
    SKILL_API_KEY: ${SKILL_API_KEY:?}
    GRIEVANCE_CLIENT_ID: ${GRIEVANCE_CLIENT_ID:?}
    GRIEVANCE_CLIENT_SECRET: ${GRIEVANCE_CLIENT_SECRET:?}
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=2)"]
    interval: 10s
    timeout: 3s
    retries: 6

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEMO_MODE: ${DEMO_MODE:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/middly_test
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2F
  OIDC_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}
  OIDC_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:-middly-api}
  CORS_ORIGINS: '["${FRONTEND_URL}"]'
  MOCK_ADMIN_KEY: ${MOCK_ADMIN_KEY}
  IDENTITY_BASE_URL: http://mock-identity:8000
  EDUCATION_BASE_URL: http://mock-education:8000
  EMPLOYMENT_BASE_URL: http://mock-employment:8000
  SKILL_BASE_URL: http://mock-skill:8000
  GRIEVANCE_BASE_URL: http://mock-grievance:8000
  IDENTITY_CLIENT_ID: ${IDENTITY_CLIENT_ID}
  IDENTITY_CLIENT_SECRET: ${IDENTITY_CLIENT_SECRET}
  EDUCATION_API_KEY: ${EDUCATION_API_KEY}
  EMPLOYMENT_BASIC_USER: ${EMPLOYMENT_BASIC_USER}
  EMPLOYMENT_BASIC_PASSWORD: ${EMPLOYMENT_BASIC_PASSWORD}
  SKILL_API_KEY: ${SKILL_API_KEY}
  GRIEVANCE_CLIENT_ID: ${GRIEVANCE_CLIENT_ID}
  GRIEVANCE_CLIENT_SECRET: ${GRIEVANCE_CLIENT_SECRET}

services:
  # ------------------------------------------------------------------ data & messaging
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [middly]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--save", "", "--appendonly", "no"]
    networks: [middly]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in .env}
    ports:
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks: [middly]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  # ------------------------------------------------------------------ identity
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Placeholders resolved inside the realm import file
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set in .env}
      FRONTEND_URL: ${FRONTEND_URL}
      DEMO_CITIZEN_PASSWORD: ${DEMO_CITIZEN_PASSWORD}
      DEMO_OFFICER_PASSWORD: ${DEMO_OFFICER_PASSWORD}
      DEMO_DEPTADMIN_PASSWORD: ${DEMO_DEPTADMIN_PASSWORD}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD}
    volumes:
      - ./infrastructure/keycloak/realm-middly.json:/opt/keycloak/data/import/realm-middly.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      postgres: {condition: service_healthy}
    networks: [middly]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ------------------------------------------------------------------ DEMO / MOCK department systems
  mock-identity:
    <<: *mock
    build: {context: ./connectors, dockerfile: Dockerfile.mock, args: {SERVICE_DIR: identity}}
  mock-education:
    <<: *mock
    build: {context: ./connectors, dockerfile: Dockerfile.mock, args: {SERVICE_DIR: education}}
  mock-employment:
    <<: *mock
    build: {context: ./connectors, dockerfile: Dockerfile.mock, args: {SERVICE_DIR: employment}}
  mock-skill:
    <<: *mock
    build: {context: ./connectors, dockerfile: Dockerfile.mock, args: {SERVICE_DIR: skill-development}}
  mock-grievance:
    <<: *mock
    build: {context: ./connectors, dockerfile: Dockerfile.mock, args: {SERVICE_DIR: grievance}}

  # ------------------------------------------------------------------ platform
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    image: middly-backend:latest
    restart: unless-stopped
    command: ["api"]
    environment:
      <<: *backend-env
      SEED_ON_STARTUP: "true"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      mock-identity: {condition: service_healthy}
      mock-education: {condition: service_healthy}
      mock-employment: {condition: service_healthy}
      mock-skill: {condition: service_healthy}
      mock-grievance: {condition: service_healthy}
    networks: [middly]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 40s

  worker:
    image: middly-backend:latest
    restart: unless-stopped
    command: ["worker"]
    environment: *backend-env
    depends_on:
      backend: {condition: service_healthy}
    networks: [middly]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/metrics', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 10

  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./infrastructure/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${GATEWAY_PORT:-8000}:80"
    depends_on:
      backend: {condition: service_healthy}
    networks: [middly]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/gateway/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build: {context: ./frontend}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL}
      API_BASE_URL: http://gateway/api/v1
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?set in .env}
      DEMO_MODE: ${DEMO_MODE:-true}
      GRAFANA_URL: http://localhost:${GRAFANA_PORT:-3001}
      PROMETHEUS_URL: http://localhost:${PROMETHEUS_PORT:-9090}
      RABBITMQ_MGMT_URL: http://localhost:${RABBITMQ_MGMT_PORT:-15672}
      GATEWAY_PUBLIC_URL: http://localhost:${GATEWAY_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      gateway: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    networks: [middly]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------ observability
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks: [middly]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/middly-overview.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on: [prometheus]
    networks: [middly]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  middly:
    name: middly-net
    driver: bridge

volumes:
  pgdata:
  rabbitmqdata:
  grafanadata:
