# Middly API Gateway (Nginx). Kong-compatible responsibilities:
#   routing, request-id propagation, coarse auth pre-check, rate limiting,
#   security headers, JSON access logs, uniform JSON errors.
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 1m;
  sendfile on;
  keepalive_timeout 30s;

  # Request correlation: reuse the caller's X-Request-ID or generate one.
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  log_format json escape=json '{"ts":"$time_iso8601","request_id":"$req_id","remote":"$remote_addr",'
                              '"method":"$request_method","uri":"$uri","status":$status,'
                              '"bytes":$body_bytes_sent,"duration":$request_time,'
                              '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time","ua":"$http_user_agent"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  # Rate limiting per client IP (the backend additionally limits per token).
  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
  limit_req_status 429;

  # Coarse authentication check: protected API routes need a bearer token.
  map $uri $public_route {
    default 0;
    ~^/api/v1/services 1;
  }
  map "$public_route:$http_authorization" $reject_unauthenticated {
    default 0;
    "~^0:$" 1;
  }

  upstream backend { server backend:8000; keepalive 16; }

  server {
    listen 80;
    server_name _;

    add_header X-Request-ID $req_id always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Gateway "middly-nginx" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $req_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The gateway owns these headers; drop upstream copies to avoid duplicates.
    proxy_hide_header X-Request-ID;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location = /gateway/health {
      default_type application/json;
      return 200 '{"status":"UP","component":"gateway"}';
    }

    location /api/ {
      limit_req zone=api_per_ip burst=60 nodelay;
      if ($reject_unauthenticated) {
        return 401;
      }
      proxy_pass http://backend;
    }

    location = /health { proxy_pass http://backend; }
    location /docs { proxy_pass http://backend; }
    location /redoc { proxy_pass http://backend; }
    location = /openapi.json { proxy_pass http://backend; }

    # Internal endpoints are never exposed through the gateway.
    location = /metrics { return 404; }

    location = / {
      default_type application/json;
      return 200 '{"gateway":"Middly API Gateway","docs":"/docs","api":"/api/v1"}';
    }

    location / { return 404; }

    error_page 401 = @unauthorized;
    error_page 404 = @not_found;
    error_page 429 = @rate_limited;
    error_page 502 503 504 = @upstream_down;

    location @unauthorized {
      default_type application/json;
      add_header X-Request-ID $req_id always;
      add_header WWW-Authenticate "Bearer" always;
      return 401 '{"error":{"code":"UNAUTHENTICATED","message":"Bearer token required (gateway)","correlation_id":"$req_id"}}';
    }
    location @not_found {
      default_type application/json;
      add_header X-Request-ID $req_id always;
      return 404 '{"error":{"code":"NOT_FOUND","message":"No route","correlation_id":"$req_id"}}';
    }
    location @rate_limited {
      default_type application/json;
      add_header X-Request-ID $req_id always;
      add_header Retry-After 1 always;
      return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests (gateway)","correlation_id":"$req_id"}}';
    }
    location @upstream_down {
      default_type application/json;
      add_header X-Request-ID $req_id always;
      return 503 '{"error":{"code":"UPSTREAM_UNAVAILABLE","message":"Platform API temporarily unavailable","correlation_id":"$req_id"}}';
    }
  }
}
