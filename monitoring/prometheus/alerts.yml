groups:
  - name: middly
    rules:
      - alert: ConnectorDown
        expr: middly_connector_up == 0
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "Department connector {{ $labels.connector }} is down"
      - alert: HighApiErrorRate
        expr: sum(rate(middly_request_count_total{status=~"5.."}[5m])) / clamp_min(sum(rate(middly_request_count_total[5m])), 1) > 0.05
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "API 5xx error rate above 5%"
      - alert: WorkflowsWaitingForSource
        expr: sum(middly_workflow_instances{status="WAITING_FOR_SOURCE"}) > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Applications blocked on unavailable department systems"
