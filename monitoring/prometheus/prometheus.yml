global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: middly-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels: {component: api}

  - job_name: middly-worker
    static_configs:
      - targets: ["worker:9100"]
        labels: {component: worker}

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels: {component: broker}

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
